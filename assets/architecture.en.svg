<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" width="1140" height="600" role="img" aria-label="AutoETL architecture and AI model integration points">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .sec-lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; }
      .box-title { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .sub-title { font-size: 12.5px; font-weight: 700; fill: #1e293b; }
      .body { font-size: 11.2px; fill: #475569; }
      .body-dark { font-size: 11.2px; fill: #334155; }
      .code-txt { font-size: 11px; fill: #1e293b; font-weight: 600; }
      .ai-txt { font-size: 11.2px; fill: #312e81; font-weight: 600; }
      .pill-txt { font-size: 10.5px; font-weight: 700; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#64748b"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#4f46e5"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="1" y="1" width="1138" height="598" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top header -->
  <text x="26" y="37" class="sans title">AutoETL Architecture — Deterministic Code First, AI Models Only Where Needed</text>

  <!-- Legend -->
  <g transform="translate(726, 18)">
    <rect x="0" y="0" width="136" height="26" rx="13" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="15" cy="13" r="4.5" fill="#475569"/>
    <text x="26" y="17" class="sans pill-txt" fill="#334155">Deterministic Code</text>

    <rect x="144" y="0" width="144" height="26" rx="13" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
    <circle cx="159" cy="13" r="4.5" fill="#4f46e5"/>
    <text x="170" y="17" class="sans pill-txt" fill="#3730a3">AI Model Zone (Opt)</text>

    <rect x="296" y="0" width="92" height="26" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <circle cx="311" cy="13" r="4.5" fill="#059669"/>
    <text x="322" y="17" class="sans pill-txt" fill="#065f46">Outputs</text>
  </g>
  <line x1="20" y1="58" x2="1120" y2="58" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Section label -->
  <text x="26" y="80" class="sans sec-lbl" fill="#64748b">UNSTRUCTURED DOCUMENT PARSER PIPELINE  (autoetl parse · autoetl ui)</text>

  <!-- COL 1: Inputs (x=24, w=186) -->
  <g transform="translate(24, 96)">
    <rect x="0" y="0" width="186" height="332" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="14" y="25" class="sans box-title">Inputs (8 Formats)</text>
    <text x="14" y="42" class="sans body">Single file or folder batch</text>

    <rect x="12" y="56" width="162" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="73" class="sans sub-title">PDF</text>
    <text x="22" y="87" class="mono body" style="font-size:10px;">.pdf (digital &amp; scan)</text>

    <rect x="12" y="102" width="162" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="119" class="sans sub-title">Word &amp; PPT</text>
    <text x="22" y="133" class="mono body" style="font-size:10px;">.docx .doc .pptx .ppt</text>

    <rect x="12" y="148" width="162" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="165" class="sans sub-title">Excel</text>
    <text x="22" y="179" class="mono body" style="font-size:10px;">.xlsx (sheets/charts)</text>

    <rect x="12" y="194" width="162" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="211" class="sans sub-title">Hancom HWP</text>
    <text x="22" y="225" class="mono body" style="font-size:10px;">.hwpx .hwp (5.0 OLE2)</text>

    <rect x="12" y="248" width="162" height="70" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="22" y="268" class="sans code-txt">Safe Defaults</text>
    <text x="22" y="285" class="sans body" style="font-size:10.5px;">• Rejects encrypted/DRM</text>
    <text x="22" y="301" class="sans body" style="font-size:10.5px;">• Local-only by default</text>
  </g>

  <line x1="210" y1="262" x2="240" y2="262" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-slate)"/>

  <!-- COL 2: Stage 1 (x=244, w=242) -->
  <g transform="translate(244, 96)">
    <rect x="0" y="0" width="242" height="332" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
    <rect x="180" y="11" width="50" height="20" rx="10" fill="#e2e8f0"/>
    <text x="205" y="25" text-anchor="middle" class="mono pill-txt" fill="#334155">CODE</text>
    <text x="14" y="25" class="sans box-title">1. Parser &amp; Router</text>
    <text x="14" y="42" class="sans body">Pure-Python deterministic engine</text>

    <rect x="12" y="56" width="218" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="22" y="76" class="sans sub-title">Format-Native Parsers</text>
    <text x="22" y="94" class="sans body">• OOXML · OWPML · OLE2 · pypdf</text>
    <text x="22" y="112" class="sans body">• Multi-column XY-Cut order</text>
    <text x="22" y="130" class="sans body">• Merged &amp; borderless tables</text>
    <text x="22" y="148" class="sans body">• Math, footnotes, charts, notes</text>
    <text x="22" y="164" class="sans body" style="font-size:10.2px; fill:#64748b;">(Auto LibreOffice upgrade for DOC/PPT)</text>

    <line x1="121" y1="174" x2="121" y2="194" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-slate)"/>

    <rect x="12" y="198" width="218" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="22" y="218" class="sans sub-title">Page &amp; Region Classifier</text>
    <text x="22" y="236" class="sans body">• Digital text &amp; tables → direct</text>
    <text x="22" y="254" class="sans body">• Scans, charts, diagrams → crop</text>
    <text x="22" y="272" class="sans body">• Per-region strategy plan</text>
    <rect x="22" y="284" width="196" height="24" rx="5" fill="#f1f5f9"/>
    <text x="120" y="300" text-anchor="middle" class="mono" style="font-size:10.5px; fill:#334155;">--plan-only dry diagnosis</text>
  </g>

  <!-- UPPER FAST PATH -->
  <path d="M 486 150 L 506 150 L 506 114 L 892 114" fill="none" stroke="#059669" stroke-width="1.9" marker-end="url(#arr-emerald)"/>
  <rect x="546" y="100" width="310" height="26" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="701" y="117" text-anchor="middle" class="sans pill-txt" fill="#065f46">Digital Text &amp; Native Tables (Zero AI Calls · Zero Cost)</text>

  <!-- LOWER AI PATH -->
  <path d="M 486 316 L 520 316" fill="none" stroke="#4f46e5" stroke-width="1.9" marker-end="url(#arr-indigo)"/>

  <!-- COL 3: Stage 2 AI Zone (x=524, w=336) -->
  <g transform="translate(524, 140)">
    <rect x="0" y="0" width="336" height="288" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="6 3"/>
    <rect x="12" y="10" width="44" height="20" rx="10" fill="#4f46e5"/>
    <text x="34" y="24" text-anchor="middle" class="mono pill-txt" fill="#ffffff">AI</text>
    <text x="64" y="24" class="sans box-title" style="fill:#1e1b4b;">2. AI Model Zone (Scans &amp; Visuals)</text>
    <text x="14" y="42" class="sans body" style="fill:#4338ca;">Invoked only on cropped scans, charts, diagrams &amp; math</text>

    <!-- AI 1 -->
    <rect x="12" y="54" width="312" height="100" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.3"/>
    <rect x="22" y="64" width="38" height="18" rx="9" fill="#e0e7ff"/>
    <text x="41" y="77" text-anchor="middle" class="mono pill-txt" fill="#3730a3">AI 1</text>
    <text x="68" y="77" class="sans sub-title">Layout Object Detection</text>
    <text x="22" y="97" class="sans ai-txt">• ONNX: PP-DocLayoutV2 / V3 · plus-L</text>
    <text x="22" y="114" class="sans body-dark">• DocLayNet · PubLayNet · HTTP service</text>
    <text x="22" y="131" class="sans body">• Splits scanned pages into typed regions</text>
    <text x="22" y="146" class="sans body" style="font-size:10.3px; fill:#64748b;">(Built-in Heuristic pixel detector fallback)</text>

    <line x1="168" y1="154" x2="168" y2="170" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arr-indigo)"/>

    <!-- AI 2 -->
    <rect x="12" y="174" width="312" height="104" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
    <rect x="22" y="184" width="38" height="18" rx="9" fill="#e0e7ff"/>
    <text x="41" y="197" text-anchor="middle" class="mono pill-txt" fill="#3730a3">AI 2</text>
    <text x="68" y="197" class="sans sub-title">OCR &amp; VLM Visual Understanding</text>
    <text x="22" y="216" class="sans ai-txt">• Specialized: PaddleOCR-VL · GLM-OCR</text>
    <text x="22" y="232" class="sans ai-txt">  DeepSeek-OCR (auto prompt presets)</text>
    <text x="22" y="249" class="sans body-dark">• General VLM: Qwen2.5-VL · GPT-4o (Ollama/vLLM)</text>
    <text x="22" y="266" class="sans body">• Hybrid: Tesseract for text, VLM for charts/figures</text>
  </g>

  <line x1="860" y1="316" x2="892" y2="316" stroke="#4f46e5" stroke-width="1.9" marker-end="url(#arr-indigo)"/>

  <!-- COL 4: Outputs (x=896, w=220) -->
  <g transform="translate(896, 96)">
    <rect x="0" y="0" width="220" height="332" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <rect x="150" y="11" width="58" height="20" rx="10" fill="#d1fae5"/>
    <text x="179" y="25" text-anchor="middle" class="mono pill-txt" fill="#065f46">OUTPUT</text>
    <text x="14" y="25" class="sans box-title" style="fill:#064e3b;">3. Unified Bundle</text>
    <text x="14" y="42" class="sans body" style="fill:#047857;">Merged IR ready for apps &amp; RAG</text>

    <rect x="12" y="56" width="196" height="44" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="22" y="74" class="mono code-txt" style="fill:#065f46;">document.md</text>
    <text x="22" y="90" class="sans body">Text, tables &amp; VLM outputs</text>

    <rect x="12" y="108" width="196" height="44" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="22" y="126" class="mono code-txt" style="fill:#065f46;">chunks.jsonl</text>
    <text x="22" y="142" class="sans body">RAG chunks (headings &amp; tables)</text>

    <rect x="12" y="160" width="196" height="44" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="22" y="178" class="mono code-txt" style="fill:#065f46;">tables/*.csv · .json</text>
    <text x="22" y="194" class="sans body">Standalone structured tables</text>

    <rect x="12" y="212" width="196" height="44" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="22" y="230" class="mono code-txt" style="fill:#065f46;">parsed.json · crops/</text>
    <text x="22" y="246" class="sans body">Full IR, routing plan &amp; crops</text>

    <rect x="12" y="264" width="196" height="54" rx="7" fill="#d1fae5" stroke="#34d399"/>
    <text x="22" y="284" class="mono code-txt" style="fill:#064e3b;">autoetl ui / batch</text>
    <text x="22" y="300" class="sans body" style="fill:#065f46;">Local Web UI · ZIP · Batch CLI</text>
  </g>

  <!-- Divider -->
  <line x1="24" y1="448" x2="1116" y2="448" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="26" y="470" class="sans sec-lbl" fill="#64748b">STRUCTURED CSV ETL PIPELINE  (autoetl analyze · v0 prototype)</text>

  <!-- Lower Track -->
  <g transform="translate(24, 482)">
    <rect x="0" y="0" width="186" height="94" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="14" y="26" class="sans sub-title">CSV Input</text>
    <text x="14" y="46" class="mono body" style="font-size:10.5px;">autoetl analyze</text>
    <text x="14" y="64" class="sans body">Auto encoding, delimiter</text>
    <text x="14" y="80" class="sans body">&amp; multi-header detection</text>

    <line x1="186" y1="47" x2="216" y2="47" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-slate)"/>

    <rect x="220" y="0" width="242" height="94" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
    <rect x="400" y="10" width="50" height="19" rx="9.5" fill="#e2e8f0"/>
    <text x="425" y="23" text-anchor="middle" class="mono pill-txt" fill="#334155">CODE</text>
    <text x="234" y="25" class="sans sub-title">Deterministic Engine</text>
    <text x="234" y="46" class="sans body">• DuckDB profiling &amp; stats</text>
    <text x="234" y="63" class="sans body">• Type, key &amp; FD discovery</text>
    <text x="234" y="80" class="sans body">• PostgreSQL DDL generator</text>

    <line x1="462" y1="47" x2="496" y2="47" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-indigo)"/>

    <rect x="500" y="0" width="336" height="94" rx="9" fill="#eef2ff" stroke="#818cf8" stroke-width="1.4" stroke-dasharray="5 3"/>
    <rect x="512" y="10" width="38" height="19" rx="9.5" fill="#4f46e5"/>
    <text x="531" y="23" text-anchor="middle" class="mono pill-txt" fill="#ffffff">AI 3</text>
    <text x="558" y="24" class="sans sub-title" style="fill:#1e1b4b;">LLM Harness (Planned / WIP)</text>
    <text x="512" y="46" class="sans body-dark">• Semantic naming &amp; schema choice assistance</text>
    <text x="512" y="63" class="sans body-dark">• Closed Pydantic contracts (no raw cell leaks)</text>
    <text x="512" y="80" class="sans body" style="fill:#4338ca;">v0 currently runs --no-llm path only</text>

    <line x1="836" y1="47" x2="868" y2="47" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-emerald)"/>

    <rect x="872" y="0" width="220" height="94" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <text x="886" y="26" class="mono code-txt" style="fill:#065f46;">report.json</text>
    <text x="886" y="46" class="sans body">Profile &amp; quality report</text>
    <text x="886" y="63" class="sans body">Expanding to candidate DDL</text>
    <text x="886" y="80" class="sans body">&amp; load plans</text>
  </g>
</svg>
