<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" width="1140" height="600" role="img" aria-label="AutoETL 서비스 구조 및 AI 모델 개입 구간">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .sec-lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; }
      .box-title { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .sub-title { font-size: 12.5px; font-weight: 700; fill: #1e293b; }
      .body { font-size: 11.2px; fill: #475569; }
      .body-dark { font-size: 11.2px; fill: #334155; }
      .code-txt { font-size: 11px; fill: #1e293b; font-weight: 600; }
      .ai-txt { font-size: 11.2px; fill: #312e81; font-weight: 600; }
      .pill-txt { font-size: 10.5px; font-weight: 700; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#64748b"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#4f46e5"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="1" y="1" width="1138" height="598" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top header -->
  <text x="26" y="37" class="sans title">AutoETL 서비스 구조 — 코드 결정론 처리 + 필요한 영역만 AI 모델 개입</text>

  <!-- Legend -->
  <g transform="translate(692, 18)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="15" cy="13" r="4.5" fill="#475569"/>
    <text x="26" y="17" class="sans pill-txt" fill="#334155">코드 결정론 (오프라인)</text>

    <rect x="148" y="0" width="152" height="26" rx="13" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
    <circle cx="163" cy="13" r="4.5" fill="#4f46e5"/>
    <text x="174" y="17" class="sans pill-txt" fill="#3730a3">AI 모델 개입 구간 (선택)</text>

    <rect x="308" y="0" width="114" height="26" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <circle cx="323" cy="13" r="4.5" fill="#059669"/>
    <text x="334" y="17" class="sans pill-txt" fill="#065f46">최종 산출물</text>
  </g>
  <line x1="20" y1="58" x2="1120" y2="58" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Section label: Document Parser -->
  <text x="26" y="80" class="sans sec-lbl" fill="#64748b">비정형 문서 파싱 파이프라인  (autoetl parse · autoetl ui)</text>

  <!-- COL 1: Input documents (x=24, w=186) -->
  <g transform="translate(24, 96)">
    <rect x="0" y="0" width="186" height="332" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="14" y="25" class="sans box-title">입력 문서 (8종)</text>
    <text x="14" y="42" class="sans body">단일 파일 / 폴더 일괄</text>

    <rect x="12" y="56" width="162" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="73" class="sans sub-title">PDF</text>
    <text x="22" y="87" class="mono body" style="font-size:10px;">.pdf (디지털·스캔)</text>

    <rect x="12" y="102" width="162" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="119" class="sans sub-title">Word · PPT</text>
    <text x="22" y="133" class="mono body" style="font-size:10px;">.docx .doc .pptx .ppt</text>

    <rect x="12" y="148" width="162" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="165" class="sans sub-title">Excel</text>
    <text x="22" y="179" class="mono body" style="font-size:10px;">.xlsx (시트·병합·차트)</text>

    <rect x="12" y="194" width="162" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="211" class="sans sub-title">한글 (HWP)</text>
    <text x="22" y="225" class="mono body" style="font-size:10px;">.hwpx .hwp (5.0 OLE2)</text>

    <rect x="12" y="248" width="162" height="70" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="22" y="268" class="sans code-txt">보안 기본값</text>
    <text x="22" y="285" class="sans body" style="font-size:10.6px;">• 암호화·DRM 안전 차단</text>
    <text x="22" y="301" class="sans body" style="font-size:10.6px;">• 외부 전송 기본 차단</text>
  </g>

  <!-- Arrow Col 1 -> Col 2 -->
  <line x1="210" y1="262" x2="240" y2="262" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-slate)"/>

  <!-- COL 2: Stage 1 Deterministic Parser & Router (x=244, w=242) -->
  <g transform="translate(244, 96)">
    <rect x="0" y="0" width="242" height="332" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
    <rect x="180" y="11" width="50" height="20" rx="10" fill="#e2e8f0"/>
    <text x="205" y="25" text-anchor="middle" class="mono pill-txt" fill="#334155">CODE</text>
    <text x="14" y="25" class="sans box-title">1. 파싱 · 구조 라우터</text>
    <text x="14" y="42" class="sans body">순수 Python 결정론 처리</text>

    <!-- Sub-box 1: Native extraction -->
    <rect x="12" y="56" width="218" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="22" y="76" class="sans sub-title">포맷별 네이티브 파서</text>
    <text x="22" y="94" class="sans body">• OOXML · OWPML · OLE2 · pypdf</text>
    <text x="22" y="112" class="sans body">• 다단 읽기 순서 (XY-Cut)</text>
    <text x="22" y="130" class="sans body">• 병합표·무선표·수식·각주 복원</text>
    <text x="22" y="148" class="sans body">• 주석·차트·내장 엑셀 추출</text>
    <text x="22" y="164" class="sans body" style="font-size:10.3px; fill:#64748b;">(DOC/PPT는 LibreOffice 시 자동 승격)</text>

    <!-- Down arrow inside Col 2 -->
    <line x1="121" y1="174" x2="121" y2="194" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-slate)"/>

    <!-- Sub-box 2: Page & Region Classifier -->
    <rect x="12" y="198" width="218" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="22" y="218" class="sans sub-title">페이지 · 영역 라우팅 판정</text>
    <text x="22" y="236" class="sans body">• 디지털 텍스트 · 표 → 즉시 출력</text>
    <text x="22" y="254" class="sans body">• 스캔 · 차트 · 도식 → 크롭 생성</text>
    <text x="22" y="272" class="sans body">• 영역별 최적 전략 기록</text>
    <rect x="22" y="284" width="196" height="24" rx="5" fill="#f1f5f9"/>
    <text x="120" y="300" text-anchor="middle" class="mono" style="font-size:10.5px; fill:#334155;">--plan-only 로 사전 진단</text>
  </g>

  <!-- UPPER FAST PATH: Digital text/tables bypass AI -->
  <path d="M 486 150 L 506 150 L 506 114 L 892 114" fill="none" stroke="#059669" stroke-width="1.9" marker-end="url(#arr-emerald)"/>
  <rect x="556" y="100" width="290" height="26" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="701" y="117" text-anchor="middle" class="sans pill-txt" fill="#065f46">디지털 본문 · 네이티브 표 (AI 미호출 · 비용 0)</text>

  <!-- LOWER AI PATH: Visual / Scan regions enter AI box -->
  <path d="M 486 316 L 520 316" fill="none" stroke="#4f46e5" stroke-width="1.9" marker-end="url(#arr-indigo)"/>

  <!-- COL 3: Stage 2 AI Model Plug-in Zone (x=524, w=336) -->
  <g transform="translate(524, 140)">
    <rect x="0" y="0" width="336" height="288" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="6 3"/>
    <rect x="12" y="10" width="44" height="20" rx="10" fill="#4f46e5"/>
    <text x="34" y="24" text-anchor="middle" class="mono pill-txt" fill="#ffffff">AI</text>
    <text x="64" y="24" class="sans box-title" style="fill:#1e1b4b;">2. AI 모델 구간 (시각·스캔 전용)</text>
    <text x="14" y="42" class="sans body" style="fill:#4338ca;">크롭된 스캔·차트·도식·수식 영역만 선택 호출</text>

    <!-- AI 1: Layout Object Detection -->
    <rect x="12" y="54" width="312" height="100" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.3"/>
    <rect x="22" y="64" width="38" height="18" rx="9" fill="#e0e7ff"/>
    <text x="41" y="77" text-anchor="middle" class="mono pill-txt" fill="#3730a3">AI ①</text>
    <text x="68" y="77" class="sans sub-title">레이아웃 객체 탐지 (스캔 분할)</text>
    <text x="22" y="97" class="sans ai-txt">• ONNX: PP-DocLayoutV2 / V3 · plus-L</text>
    <text x="22" y="114" class="sans body-dark">• DocLayNet · PubLayNet · HTTP 서비스</text>
    <text x="22" y="131" class="sans body">• 스캔 페이지를 표·차트·수식·본문으로 분할</text>
    <text x="22" y="146" class="sans body" style="font-size:10.3px; fill:#64748b;">(모델 미설치 시 내장 Heuristic 픽셀 탐지기 폴백)</text>

    <!-- Arrow AI 1 -> AI 2 -->
    <line x1="168" y1="154" x2="168" y2="170" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arr-indigo)"/>

    <!-- AI 2: OCR / VLM Vision Models -->
    <rect x="12" y="174" width="312" height="104" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
    <rect x="22" y="184" width="38" height="18" rx="9" fill="#e0e7ff"/>
    <text x="41" y="197" text-anchor="middle" class="mono pill-txt" fill="#3730a3">AI ②</text>
    <text x="68" y="197" class="sans sub-title">OCR · VLM 시각 영역 해석</text>
    <text x="22" y="216" class="sans ai-txt">• 경량 OCR-VLM: PaddleOCR-VL · GLM-OCR</text>
    <text x="22" y="232" class="sans ai-txt">  DeepSeek-OCR (모델별 전용 프롬프트 자동 적용)</text>
    <text x="22" y="249" class="sans body-dark">• 범용 VLM: Qwen2.5-VL · GPT-4o (Ollama/vLLM)</text>
    <text x="22" y="266" class="sans body">• Hybrid: 텍스트는 Tesseract, 차트·도식만 VLM</text>
  </g>

  <!-- Arrow Col 3 -> Col 4 -->
  <line x1="860" y1="316" x2="892" y2="316" stroke="#4f46e5" stroke-width="1.9" marker-end="url(#arr-indigo)"/>

  <!-- COL 4: Stage 3 Unified Output & Consumption (x=896, w=220) -->
  <g transform="translate(896, 96)">
    <rect x="0" y="0" width="220" height="332" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <rect x="150" y="11" width="58" height="20" rx="10" fill="#d1fae5"/>
    <text x="179" y="25" text-anchor="middle" class="mono pill-txt" fill="#065f46">OUTPUT</text>
    <text x="14" y="25" class="sans box-title" style="fill:#064e3b;">3. 산출물 · 활용</text>
    <text x="14" y="42" class="sans body" style="fill:#047857;">통합 IR 병합 후 내보내기</text>

    <rect x="12" y="56" width="196" height="44" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="22" y="74" class="mono code-txt" style="fill:#065f46;">document.md</text>
    <text x="22" y="90" class="sans body">본문·표·VLM 해석 통합</text>

    <rect x="12" y="108" width="196" height="44" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="22" y="126" class="mono code-txt" style="fill:#065f46;">chunks.jsonl</text>
    <text x="22" y="142" class="sans body">RAG 청크 (제목·표 헤더 유지)</text>

    <rect x="12" y="160" width="196" height="44" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="22" y="178" class="mono code-txt" style="fill:#065f46;">tables/*.csv · .json</text>
    <text x="22" y="194" class="sans body">정형 표 개별 내보내기</text>

    <rect x="12" y="212" width="196" height="44" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="22" y="230" class="mono code-txt" style="fill:#065f46;">parsed.json · crops/</text>
    <text x="22" y="246" class="sans body">전체 IR · 전략 리포트 · 크롭</text>

    <rect x="12" y="264" width="196" height="54" rx="7" fill="#d1fae5" stroke="#34d399"/>
    <text x="22" y="284" class="mono code-txt" style="fill:#064e3b;">autoetl ui / batch</text>
    <text x="22" y="300" class="sans body" style="fill:#065f46;">로컬 웹 UI · ZIP · 폴더 병렬 배치</text>
  </g>

  <!-- Divider between Unstructured Parser and Structured ETL -->
  <line x1="24" y1="448" x2="1116" y2="448" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="26" y="470" class="sans sec-lbl" fill="#64748b">정형 CSV ETL 파이프라인  (autoetl analyze · v0 프로토타입)</text>

  <!-- Lower Track: Structured CSV ETL -->
  <g transform="translate(24, 482)">
    <!-- Col 1: CSV Input (w=186) -->
    <rect x="0" y="0" width="186" height="94" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="14" y="26" class="sans sub-title">정형 CSV 입력</text>
    <text x="14" y="46" class="mono body" style="font-size:10.5px;">autoetl analyze</text>
    <text x="14" y="64" class="sans body">인코딩·구분자·다중 헤더</text>
    <text x="14" y="80" class="sans body">자동 감지</text>

    <line x1="186" y1="47" x2="216" y2="47" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-slate)"/>

    <!-- Col 2: Deterministic DuckDB Engine (x=220, w=242) -->
    <rect x="220" y="0" width="242" height="94" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
    <rect x="400" y="10" width="50" height="19" rx="9.5" fill="#e2e8f0"/>
    <text x="425" y="23" text-anchor="middle" class="mono pill-txt" fill="#334155">CODE</text>
    <text x="234" y="25" class="sans sub-title">결정론 분석 엔진</text>
    <text x="234" y="46" class="sans body">• DuckDB 기반 프로파일링 · 통계</text>
    <text x="234" y="63" class="sans body">• 타입 추론 · 후보키 · 함수종속(FD)</text>
    <text x="234" y="80" class="sans body">• PostgreSQL DDL 코드 생성</text>

    <line x1="462" y1="47" x2="496" y2="47" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-indigo)"/>

    <!-- Col 3: AI 3 Structured LLM Harness (x=500, w=336) -->
    <rect x="500" y="0" width="336" height="94" rx="9" fill="#eef2ff" stroke="#818cf8" stroke-width="1.4" stroke-dasharray="5 3"/>
    <rect x="512" y="10" width="38" height="19" rx="9.5" fill="#4f46e5"/>
    <text x="531" y="23" text-anchor="middle" class="mono pill-txt" fill="#ffffff">AI ③</text>
    <text x="558" y="24" class="sans sub-title" style="fill:#1e1b4b;">LLM 하네스 (연동 예정)</text>
    <text x="512" y="46" class="sans body-dark">• 애매한 의미 해석 · 테이블 명명 · 스키마 선택</text>
    <text x="512" y="63" class="sans body-dark">• Pydantic 계약 검증 (실제 셀 값 외부 미전송)</text>
    <text x="512" y="80" class="sans body" style="fill:#4338ca;">현재 v0는 --no-llm 경로만 지원</text>

    <line x1="836" y1="47" x2="868" y2="47" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-emerald)"/>

    <!-- Col 4: Report Output (x=872, w=220) -->
    <rect x="872" y="0" width="220" height="94" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <text x="886" y="26" class="mono code-txt" style="fill:#065f46;">report.json</text>
    <text x="886" y="46" class="sans body">프로파일 · 품질 리포트</text>
    <text x="886" y="63" class="sans body">PostgreSQL 스키마 후보</text>
    <text x="886" y="80" class="sans body">· 적재 플랜 확장 중</text>
  </g>
</svg>
